name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish Cargo Package
    runs-on: codeberg-small

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install MinGW-w64 cross-compilation toolchain
        run: sudo apt-get update -q && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Configure Codeberg Cargo registry
        env:
          CODEBERG_OWNER: ${{ vars.CODEBERG_OWNER }}
        run: |
          mkdir -p ~/.cargo
          printf '[registries.codeberg]\nindex = "sparse+https://codeberg.org/api/packages/%s/cargo/"\n' "$CODEBERG_OWNER" >> ~/.cargo/config.toml
          echo "--- config.toml ---"
          cat ~/.cargo/config.toml

      - name: Configure Cargo credentials
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          mkdir -p ~/.cargo
          printf '[registries.codeberg]\ntoken = "Bearer %s"\n' "$CODEBERG_TOKEN" >> ~/.cargo/credentials.toml
          echo "--- credentials.toml (token masked) ---"
          grep -o '^\[.*\]' ~/.cargo/credentials.toml

      - name: Publish package
        run: cargo publish --registry codeberg --target x86_64-pc-windows-gnu
